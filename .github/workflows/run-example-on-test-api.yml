name: run example on test api

on:
  pull_request:
    branches:
      - master
      - stable
      - develop

jobs:
  run_smoke_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'zulu'
          java-version: 11
          java-package: jdk

      - name: Run Smoke Test
        run: ./gradlew clean :example:run
        env:
          API_BASE_PATH: ${{ github.base_ref == 'develop' && 'https://nightly-faceapi.regulaforensics.com' || github.base_ref == 'stable' && 'https://rc-faceapi.regulaforensics.com' || github.base_ref == 'master' && 'https://faceapi.regulaforensics.com' || 'https://nightly-faceapi.regulaforensics.com' }}
          TEST_LICENSE: ${{secrets.TEST_LICENSE}}
